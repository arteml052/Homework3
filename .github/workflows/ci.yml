name: Кейс № 1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v6

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить сборку
        run: npm run build

      - name: Запустить тесты
        run: npm test