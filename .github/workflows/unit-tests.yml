name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать исходный код
        uses: actions/checkout@v6

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Запустить юнит-тесты
        run: npm test