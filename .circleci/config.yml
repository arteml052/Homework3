version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/node:22.14

    steps:
      - checkout

      - run:
          name: Установить зависимости
          command: npm ci

      - run:
          name: Проверить приложение
          command: |
            npm run build
            node --check src/server.js

      - run:
          name: Запустить тесты
          command: npm test

  deploy:
    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Развернуть приложение на Render
          command: |
            if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
              echo "Не задана переменная RENDER_DEPLOY_HOOK_URL"
              exit 1
            fi

            curl --fail --show-error --silent --request POST \
              "${RENDER_DEPLOY_HOOK_URL}&ref=${CIRCLE_SHA1}"

workflows:
  case-3:
    jobs:
      - build-and-test:
          filters:
            branches:
              only: main

      - deploy:
          requires:
            - build-and-test
          filters:
            branches:
              only: main